spring:
  datasource:
    url: jdbc:h2:mem:banking
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  h2:
    console:
      enabled: true

# JWT_SECRET in IDE environment variables, default is the stuff preceding : not dependent on ${}
banking:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-must-be-at-least-32-bytes-long!!}
    ttl-minutes: ${JWT_TTL_MINUTES:60}